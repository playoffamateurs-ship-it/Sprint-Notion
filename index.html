<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Timeline finale — PlayOff Amateurs</title>
  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --border: rgba(15, 23, 42, .12);
      --muted: rgba(15, 23, 42, .65);
      --text: #0f172a;

      --accent: #2563eb;
      --accent2:#22c55e;
      --warning:#f59e0b;
      --danger:#ef4444;

      --shadow: 0 10px 30px rgba(2, 6, 23, .08);
      --radius: 16px;
    }

    *{ box-sizing: border-box; margin: 0; padding: 0; }

    body{
      margin: 0;
      padding: 12px;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap{
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .card{
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(to right, rgba(37,99,235,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(37,99,235,.06) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 25% 0%, rgba(0,0,0,.45), transparent 55%);
      pointer-events:none;
    }
    .card > *{ position: relative; z-index: 1; }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 16px;
      flex-wrap:wrap;
      margin-bottom: 20px;
    }

    .left{
      display:flex;
      flex-direction:column;
      gap: 8px;
      flex: 1;
      min-width: 280px;
    }

    .title{
      display:flex;
      align-items:center;
      gap: 12px;
      flex-wrap:wrap;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .2px;
    }

    .pill{
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(37, 99, 235, .06);
      white-space: nowrap;
    }

    .meta{
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .right{
      text-align:right;
      min-width: 220px;
    }

    .big{
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
      color: var(--accent);
    }

    .small{
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .timelineWrap{
      padding-top: 20px;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .track{
      position: relative;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-bottom: 16px;
    }

    .segment{
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: rgba(2, 6, 23, .02);
      position: relative;
      overflow:hidden;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .segment .segTitle{
      font-weight: 900;
      font-size: 15px;
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag{
      font-size: 10px;
      font-weight: 900;
      letter-spacing:.3px;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px;
      background: #fff;
      white-space: nowrap;
    }

    .dates{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .current{
      background: rgba(37, 99, 235, .08);
      border-color: rgba(37, 99, 235, .25);
      border-width: 2px;
    }

    .done{
      background: rgba(34, 197, 94, .08);
      border-color: rgba(34, 197, 94, .20);
    }

    .upcoming{
      background: rgba(245, 158, 11, .06);
      border-color: rgba(245, 158, 11, .20);
    }

    .current .segTitle{ color: var(--accent); }

    .miniBar{
      margin-top: auto;
      height: 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .10);
      overflow:hidden;
    }

    .miniFill{
      height:100%;
      width:0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 1200ms cubic-bezier(.2,.9,.2,1);
      position:relative;
    }

    .miniFill::after{
      content:"";
      position:absolute;
      top:0; left:-40%;
      width: 40%;
      height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-18deg);
      animation: sheen 2.8s infinite;
      opacity: .7;
    }

    @keyframes sheen{
      0%   { left:-45%; }
      60%  { left:110%; }
      100% { left:110%; }
    }

    .todayMarker{
      position:absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 6px;
      z-index: 10;
    }

    .dot{
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(37,99,235,.15);
      border: 2px solid white;
    }

    .label{
      font-size: 11px;
      font-weight: 900;
      color: var(--accent);
      background: #fff;
      border: 1px solid rgba(37,99,235,.3);
      border-radius: 999px;
      padding: 5px 10px;
      white-space:nowrap;
      box-shadow: 0 2px 8px rgba(37,99,235,.15);
    }

    .line{
      width: 2px;
      height: 16px;
      background: rgba(37,99,235,.4);
      border-radius: 999px;
    }

    .hint{
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 600px){
      body{ padding: 10px; }
      .card{ padding: 16px; }
      .track{
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .todayMarker{ display:none; }
      .right{
        text-align:left;
        min-width: auto;
      }
      .header{
        flex-direction: column;
        gap: 12px;
      }
      .big{ font-size: 28px; }
      .title{ font-size: 20px; }
      .segment{ padding: 12px; min-height: 90px; }
    }

    @media (max-width: 400px){
      body{ padding: 8px; }
      .card{ padding: 14px; }
      .big{ font-size: 24px; }
      .title{ font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card" role="group" aria-label="Timeline finale">
      <div class="header">
        <div class="left">
          <div class="title">
            <span id="currentTitle">Étape —</span>
            <span class="pill" id="pill">—</span>
          </div>
          <div class="meta" id="currentRange">—</div>
        </div>

        <div class="right">
          <div class="big" id="pct">—%</div>
          <div class="small" id="kpi">—</div>
        </div>
      </div>

      <div class="timelineWrap">
        <div class="todayMarker" id="marker" aria-hidden="true">
          <div class="label" id="todayLabel">Aujourd’hui</div>
          <div class="dot"></div>
          <div class="line"></div>
        </div>

        <div class="track" id="track">
          <div class="segment" id="prevSeg">
            <div class="segTitle">
              <span id="prevName">—</span>
              <span class="tag" id="prevTag">terminé</span>
            </div>
            <div class="dates" id="prevDates">—</div>
          </div>

          <div class="segment current" id="curSeg">
            <div class="segTitle">
              <span id="curName">—</span>
              <span class="tag" id="curTag">en cours</span>
            </div>
            <div class="dates" id="curDates">—</div>
            <div class="miniBar">
              <div class="miniFill" id="miniFill"></div>
            </div>
          </div>

          <div class="segment" id="nextSeg">
            <div class="segTitle">
              <span id="nextName">—</span>
              <span class="tag" id="nextTag">à venir</span>
            </div>
            <div class="dates" id="nextDates">—</div>
          </div>
        </div>

        <div class="hint" id="hint">Dernière ligne droite avant le rendu final et la soutenance.</div>
      </div>
    </div>
  </div>

<script>
  const MILESTONES = [
    {
      name: "Dernier sprint",
      start: "2026-03-14T00:00:00",
      end:   "2026-03-27T23:59:59",
      display: "Jusqu’au 27/03/2026",
      short: "Sprint finalisé"
    },
    {
      name: "Rendu du dossier écrit",
      start: "2026-03-28T00:00:00",
      end:   "2026-03-30T23:59:59",
      display: "30/03/2026 avant minuit",
      short: "Dossier à rendre"
    },
    {
      name: "Soutenance",
      start: "2026-03-31T00:00:00",
      end:   "2026-04-02T16:00:00",
      display: "02/04/2026 à 16h00",
      short: "Présentation orale"
    }
  ];

  const pad = (n) => String(n).padStart(2, "0");
  const formatFRDate = (d) => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  const formatFRDateTime = (d) =>
    `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} à ${pad(d.getHours())}h${pad(d.getMinutes())}`;

  const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

  function diffParts(from, to){
    const ms = to - from;
    const totalMinutes = Math.max(0, Math.floor(ms / 60000));
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const minutes = totalMinutes % 60;
    return { days, hours, minutes };
  }

  function formatCountdown(from, to){
    const { days, hours, minutes } = diffParts(from, to);
    if (days > 0) return `${days}j ${hours}h restantes`;
    if (hours > 0) return `${hours}h ${minutes}min restantes`;
    return `${minutes} min restantes`;
  }

  function getPhase(now){
    const dates = MILESTONES.map(m => ({
      ...m,
      startDate: new Date(m.start),
      endDate: new Date(m.end)
    }));

    if (now <= dates[0].endDate){
      return {
        prev: dates[0],
        cur: dates[1],
        next: dates[2],
        currentStep: dates[1],
        progressStart: dates[0].endDate,
        progressEnd: dates[1].endDate
      };
    }

    if (now <= dates[1].endDate){
      return {
        prev: dates[0],
        cur: dates[1],
        next: dates[2],
        currentStep: dates[1],
        progressStart: dates[1].startDate,
        progressEnd: dates[1].endDate
      };
    }

    if (now <= dates[2].endDate){
      return {
        prev: dates[1],
        cur: dates[2],
        next: dates[2],
        currentStep: dates[2],
        progressStart: dates[2].startDate,
        progressEnd: dates[2].endDate
      };
    }

    return {
      prev: dates[1],
      cur: dates[2],
      next: dates[2],
      currentStep: null,
      progressStart: dates[2].startDate,
      progressEnd: dates[2].endDate,
      finished: true
    };
  }

  function compute(){
    const now = new Date();
    const phase = getPhase(now);

    const prevSeg = document.getElementById("prevSeg");
    const curSeg = document.getElementById("curSeg");
    const nextSeg = document.getElementById("nextSeg");

    prevSeg.className = "segment done";
    curSeg.className = "segment current";
    nextSeg.className = "segment upcoming";

    document.getElementById("prevName").textContent = phase.prev.name;
    document.getElementById("prevDates").textContent = phase.prev.display;

    document.getElementById("curName").textContent = phase.cur.name;
    document.getElementById("curDates").textContent = phase.cur.display;

    document.getElementById("nextName").textContent = phase.next.name;
    document.getElementById("nextDates").textContent = phase.next.display;

    let pct = 100;
    let title = "Projet finalisé";
    let pill = "Terminé";
    let meta = "Toutes les échéances sont passées.";
    let kpi = "Bravo, dernière étape franchie.";

    if (!phase.finished){
      const total = phase.progressEnd - phase.progressStart;
      const elapsed = clamp(now - phase.progressStart, 0, total);
      pct = total <= 0 ? 100 : Math.round((elapsed / total) * 100);

      title = phase.currentStep.name;
      pill = formatCountdown(now, phase.currentStep.endDate || phase.progressEnd);
      meta = `Prochaine échéance : ${phase.currentStep.display}`;

      if (phase.currentStep.name === "Rendu du dossier écrit"){
        kpi = `Cap sur le dossier • ${formatCountdown(now, new Date(MILESTONES[1].end))}`;
      } else {
        kpi = `Cap sur la soutenance • ${formatCountdown(now, new Date(MILESTONES[2].end))}`;
      }
    }

    document.getElementById("currentTitle").textContent = title;
    document.getElementById("pill").textContent = pill;
    document.getElementById("currentRange").textContent = meta;
    document.getElementById("pct").textContent = `${pct}%`;
    document.getElementById("kpi").textContent = kpi;

    const miniFill = document.getElementById("miniFill");
    setTimeout(() => {
      miniFill.style.width = `${pct}%`;
    }, 100);

    let pos = 0.5;
    const timelineStart = new Date(MILESTONES[0].start);
    const timelineEnd = new Date(MILESTONES[2].end);
    const totalTimeline = timelineEnd - timelineStart;
    const elapsedTimeline = clamp(now - timelineStart, 0, totalTimeline);
    pos = totalTimeline <= 0 ? 1 : elapsedTimeline / totalTimeline;

    const marker = document.getElementById("marker");
    marker.style.left = `${pos * 100}%`;
    document.getElementById("todayLabel").textContent = `Aujourd’hui • ${formatFRDateTime(now)}`;

    document.getElementById("hint").textContent =
      "Dernière ligne droite : rendu du dossier écrit le 30/03 avant minuit, puis soutenance le 02/04 à 16h.";
  }

  compute();
  setInterval(compute, 60 * 1000);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) compute();
  });
</script>
</body>
</html>
